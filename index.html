<script></script>
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <style>
      #main {
        font-size: 2em;
        text-align: center;
        margin-top: 50vh;
      }
      li {
        font-size: 2em;
        text-align: center;
      }
    </style>
    <div id="main">What is Mary's favorite Nintendo franchise?</div>
    <div id="hints">
    <ol id="hintlist">
    </ol>
    </div>
    <script>
      let ix = 1;
      // interval in ms
      let interval = 11000;

      function setHint(hint) {
        const local_ix = ix;
        ix += 1;

      setTimeout(() => {
       const li = document.createElement("li");
        li.textContent = hint
        document.getElementById("hintlist").appendChild(li);
        }, local_ix * interval);
      }

      setHint("Hint: think like hackerman");
      setHint("Hint: the answer is attached to something made of glass");
      setHint("Hint: de-X where X is a Googler's worst enemy");

      window.zelda = () => {
        document.getElementById("main").innerText = "Correct! Mary loves Zelda! Your next clue is: In the darkest of timelines, I find myself downstairs with a goatee.";
      };
      window.Zelda = window.zelda;
    </script>
  </body>
</html>
